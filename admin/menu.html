<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Menu | Owner Panel</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="admin-bar" id="admin-bar"></div>
<main class="container hidden" id="admin-main">
<h1 class="page-title">Menu Items</h1>
<form class="form" onsubmit="addItem(event)" style="max-width:520px">
  <h3>Add New Item</h3>
  <label>Category<select name="category">
    <option>Pizza</option><option>Special Pizza</option><option>Burgers</option><option>Shawarma &amp; Paratha</option>
    <option>Sides &amp; Snacks</option><option>Regular Deals</option><option>Pizza Deals</option><option>Family Deals</option></select></label>
  <label>Name<input name="name" required maxlength="100"></label>
  <label>Description (optional)<input name="description" maxlength="255"></label>
  <label>Price (Rs.)<input name="price" type="number" min="1" required></label>
  <button class="btn">Add Item</button>
</form>
<div class="table-wrap" style="margin-top:20px"><table>
  <thead><tr><th>Category</th><th>Name</th><th>Price / Small</th><th>Other sizes</th><th>Shown?</th><th></th></tr></thead>
  <tbody id="menu-body"></tbody></table></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/admin.js"></script>
<script>requireAdmin().then(u => u && loadMenuAdmin());</script>
</body>
</html>
